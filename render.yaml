# One-click deploy on Render (Dashboard → New → Blueprint → pick this repo).
# Frontend and backend run as ONE service on one origin, so the secure
# SameSite=Strict session cookie and the strict CSP work as designed.
services:
  - type: web
    name: ghostslot
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm --prefix server install --omit=dev && npm run build
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      # Change these on Render (no code change) if Google retires the model.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_PARSE_MODEL
        value: gemini-3.6-flash
      # Required: accounts live in Supabase (Render's free
      # disk is wiped on every deploy). Paste both from the Supabase dashboard:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Demo login for judges is shown on the login screen. Set DEMO_PASSWORD
      # to something easy to type (default: Ghost-Demo-2026).
      - key: DEMO_PASSWORD
        sync: false
